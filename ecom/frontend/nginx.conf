# Redireciona HTTP → HTTPS na porta correta
server {
    listen 80;
    return 301 https://$host:3443$request_uri;
}

server {
    listen 443 ssl;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Proxy reverso para cada microsserviço — o browser nunca precisa de IP externo
    location /api/usuarios/    { proxy_pass http://svc-usuarios:8001/;    proxy_set_header Host $host; }
    location /api/produtos/    { proxy_pass http://svc-produtos:8002/;    proxy_set_header Host $host; }
    location /api/estoque/     { proxy_pass http://svc-estoque:8003/;     proxy_set_header Host $host; }
    location /api/pedidos/     { proxy_pass http://svc-pedidos:8004/;     proxy_set_header Host $host; }
    location /api/pagamentos/  { proxy_pass http://svc-pagamentos:8005/;  proxy_set_header Host $host; }
    location /api/notificacoes/{ proxy_pass http://svc-notificacoes:8006/;proxy_set_header Host $host; }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
